[alias]
xtest = "nextest run --all-features"
lint = "clippy --workspace --all-targets --all-features -- -D warnings"
profile = "run --profile profiling --features tracy"
perf = "bench --workspace --benches -- --sample-size 200 --warm-up-time 5 --measurement-time 15"
perf-quick = "bench --workspace --benches -- --sample-size 30 --warm-up-time 1 --measurement-time 3 --noplot"

[env]
# Tracy spans do not need native callstacks, which repeat Rust's DbgHelp initialization on Windows.
TRACY_CLIENT_SYS_CXXFLAGS = { value = "-DTRACY_NO_CALLSTACK", force = false }
