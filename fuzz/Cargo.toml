[package]
name = "viewer-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "LGPL-2.1-only"

[package.metadata]
cargo-fuzz = true

[dependencies]
base = { path = "../crates/common/base" }
math = { path = "../crates/common/math" }
libfuzzer-sys = "0.4"
protocol = { path = "../crates/protocol" }
llsd = { path = "../crates/common/llsd" }
network = { path = "../crates/network" }
world = { path = "../crates/world" }

[workspace]
members = ["."]

[[bin]]
name = "packet"
path = "fuzz_targets/packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "world_state"
path = "fuzz_targets/world_state.rs"
test = false
doc = false
bench = false

[[bin]]
name = "llsd"
path = "fuzz_targets/llsd.rs"
test = false
doc = false
bench = false
