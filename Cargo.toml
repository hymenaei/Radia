[workspace]
resolver = "3"
members = [
    "apps/viewer",
    "crates/llsd",
    "crates/math",
    "crates/utils",
    "crates/test-support",
    "crates/network",
    "crates/protocol",
    "crates/world",
    "crates/render",
    "crates/storage",
    "crates/assets",
    "crates/inventory",
]
default-members = ["apps/viewer"]

[workspace.package]
edition = "2024"
version = "0.0.1"
license = "LGPL-2.1-only"

[workspace.dependencies]
assets = { path = "crates/assets" }
inventory = { path = "crates/inventory" }
imbl = { version = "7.0.2", default-features = false }
llsd = { path = "crates/llsd" }
math = { path = "crates/math" }
network = { path = "crates/network" }
protocol = { path = "crates/protocol" }
render = { path = "crates/render" }
storage = { path = "crates/storage" }
test-support = { path = "crates/test-support" }
utils = { path = "crates/utils" }
world = { path = "crates/world" }

base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
block_compression = { version = "=0.10.1", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
criterion = "0.8"
dirs = "=7.0.0"
dxr = "=0.9.0"
egui = { version = "=0.37.0", default-features = false, features = [
    "default_fonts",
] }
egui-wgpu = { version = "=0.37.0", default-features = false }
egui-winit = { version = "=0.37.0", default-features = false }
flate2 = "=1.1.10"
futures = "0.3"
glam = "0.34.1"
gpui = { package = "gpui-ce", version = "=0.2.2" }
gpui-component = { package = "gpui_ce_components", version = "=0.2.0" }
gpui-component-assets = { package = "gpui_ce_components_assets", version = "=0.2.0" }
gpui-platform = { package = "gpui_ce_platform", version = "=0.1.0" }
hecs = "0.11"
httpdate = "=1.0.3"
intel_tex_2 = "=0.5.0"
jpeg2k = { version = "=0.10.1", default-features = false }
keyring = { version = "=3.6.3", default-features = false }
md-5 = { version = "=0.11.0", default-features = false }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
quick-xml = "=0.42.0"
reqwest = { version = "=0.13.5", default-features = false, features = [
    "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11.1", default-features = false }
tempfile = "3"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "0.3", features = [
    "json",
    "chrono",
    "env-filter",
] }
tracing-tracy = { version = "=0.12.0", default-features = false, features = [
    "enable",
    "ondemand",
    "only-localhost",
] }
url = "2"
uuid = "1"
wgpu = { version = "=30.0.1", default-features = false, features = [
    "std",
    "vulkan",
    "wgsl",
] }
winit = { version = "=0.30.13", default-features = false, features = [
    "rwh_06",
] }

[workspace.lints.clippy]
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
large_enum_variant = "allow"
perf = { level = "deny", priority = -1 }
redundant_clone = "deny"
suspicious = { level = "deny", priority = -1 }
too_many_arguments = "allow"
upper_case_acronyms = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = 0
lto = "thin"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
lto = false
