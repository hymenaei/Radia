[workspace]
resolver = "3"
members = [
    "apps/viewer",
    "crates/common/base",
    "crates/common/llsd",
    "crates/network",
    "crates/protocol",
    "crates/test-support",
]
default-members = ["apps/viewer"]

[workspace.package]
edition = "2024"
version = "0.0.1"
license = "LGPL-2.1-only"

[workspace.dependencies]
criterion = "0.8"
futures = "0.3"
gpui = { package = "gpui-ce", version = "=0.2.2" }
gpui-component = { package = "gpui_ce_components", version = "=0.2.0" }
gpui-platform = { package = "gpui_ce_platform", version = "=0.1.0" }
quick-xml = "=0.41.0"
proptest = "=1.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
httpdate = "=1.0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["chrono"] }
tracing-log = "0.2"
tracing-tracy = { version = "=0.12.0", default-features = false, features = ["enable", "ondemand", "only-localhost"] }
url = "2"
uuid = "1"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
test-support = { path = "crates/test-support" }
base = { path = "crates/common/base" }
llsd = { path = "crates/common/llsd" }
network = { path = "crates/network" }
protocol = { path = "crates/protocol" }
base64 = "=0.22.1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

# dxr 0.8.0 pins vulnerable quick-xml 0.37, so keep this patched copy until upstream updates.
[patch.crates-io]
dxr = { path = "vendor/dxr" }

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
redundant_clone = "deny"
upper_case_acronyms = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = 0
lto = "thin"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
lto = false